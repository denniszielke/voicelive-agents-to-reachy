name: voicelive-agents-to-reachy
metadata:
  template: voicelive-agents-to-reachy@0.0.1
infra:
  provider: bicep
  path: ./infra
hooks:
  postdeploy:
    - shell: sh
      run: cp .azure/$AZURE_ENV_NAME/.env ./
    # After `azd up`, build + register the two hosted agents (weather-agent,
